name: Compilar APK Android

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK (API 36.1)
        run: |
          SDKMANAGER=$(find "${ANDROID_HOME}/cmdline-tools" -name sdkmanager -type f | sort -r | head -n 1)
          echo "Usando sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36.1" "build-tools;36.0.0"

      - name: Restaurar debug.keystore
        run: base64 -d debug.keystore.base64 > debug.keystore

      - name: Configurar Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Ejecutar pruebas unitarias
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Compilar APK real (Debug)
        run: gradle :app:assembleDebug --no-daemon

      - name: Subir APK instalable
        uses: actions/upload-artifact@v4
        with:
          name: ImmichVault-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
